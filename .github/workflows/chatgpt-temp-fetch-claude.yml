name: Temporary fetch Claude snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Claude snapshot
        shell: bash
        run: |
          python -m pip install --quiet curl_cffi
          python - <<'PY'
          import json
          from curl_cffi import requests

          uuid = "11e8f7e5-4576-4173-983e-ad326983a3a7"
          api = f"https://claude.ai/api/chat_snapshots/{uuid}"
          share = f"https://claude.ai/share/{uuid}"
          r = requests.get(
              api,
              impersonate="chrome",
              timeout=60,
              headers={"Accept": "*/*", "Referer": share},
          )
          print("HTTP", r.status_code, r.headers.get("content-type"))
          r.raise_for_status()
          data = r.json()
          with open("snapshot.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          messages = sorted(data.get("chat_messages", []), key=lambda m: m.get("index", 0))
          out = [f"# {data.get('snapshot_name') or 'Claude conversation'}", ""]
          for m in messages:
              role = m.get("sender", "unknown").title()
              out += ["---", "", f"## {role}", ""]
              content = m.get("content")
              parts = []
              if isinstance(content, list):
                  for block in content:
                      if not isinstance(block, dict):
                          continue
                      if block.get("type") == "text" and block.get("text"):
                          parts.append(block["text"])
                  body = "\n\n".join(parts)
              else:
                  body = m.get("text") or ""
              out.append(body)
              out.append("")
          with open("transcript.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: claude-snapshot
          path: |
            snapshot.json
            transcript.md
          retention-days: 1
