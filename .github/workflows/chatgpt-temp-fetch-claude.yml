name: Temporary fetch Claude snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Render and extract public Claude share
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, re

          share = "https://claude.ai/share/11e8f7e5-4576-4173-983e-ad326983a3a7"
          api_fragment = "/api/chat_snapshots/11e8f7e5-4576-4173-983e-ad326983a3a7"
          captured = {}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              context = browser.new_context(
                  viewport={"width": 1440, "height": 1200},
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36",
                  locale="en-US",
              )
              page = context.new_page()

              def on_response(resp):
                  if api_fragment in resp.url:
                      try:
                          captured["snapshot"] = resp.json()
                          print("Captured snapshot response", resp.status)
                      except Exception as e:
                          print("Snapshot response parse failed", resp.status, e)

              page.on("response", on_response)
              page.goto(share, wait_until="domcontentloaded", timeout=120000)
              page.wait_for_timeout(15000)
              for _ in range(12):
                  page.mouse.wheel(0, 4000)
                  page.wait_for_timeout(750)
              page.screenshot(path="claude-share.png", full_page=True)
              html = page.content()
              text = page.locator("body").inner_text()
              open("page.html", "w", encoding="utf-8").write(html)
              open("page.txt", "w", encoding="utf-8").write(text)
              print("TITLE:", page.title())
              print("BODY CHARS:", len(text))
              print(text[:4000])
              browser.close()

          if "snapshot" in captured:
              data = captured["snapshot"]
              open("snapshot.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False, indent=2))
              messages = sorted(data.get("chat_messages", []), key=lambda m: m.get("index", 0))
              out = [f"# {data.get('snapshot_name') or 'Claude conversation'}", ""]
              for m in messages:
                  role = m.get("sender", "unknown").title()
                  out += ["---", "", f"## {role}", ""]
                  content = m.get("content")
                  parts = []
                  if isinstance(content, list):
                      for block in content:
                          if isinstance(block, dict) and block.get("type") == "text" and block.get("text"):
                              parts.append(block["text"])
                      body = "\n\n".join(parts)
                  else:
                      body = m.get("text") or ""
                  out += [body, ""]
              open("transcript.md", "w", encoding="utf-8").write("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-snapshot
          path: |
            snapshot.json
            transcript.md
            page.txt
            page.html
            claude-share.png
          if-no-files-found: warn
          retention-days: 1
